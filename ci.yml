Global:
  version: "2.0"

Default:
  profile: [publish]

Profiles:
  - profile:
    name: dev
    mode: AGENT
    environment:
      image: ubuntu:22.04
      tools:
        - python: 3.12.0
    build:
      command: pip3 install -r requirements.txt && python3 -m build

  - profile:
    name: publish
    mode: AGENT
    environment:
      image: ubuntu:22.04
      tools:
        - python: 3.12.0
    build:
      command: pip3 install -r requirements.txt && python3 -m build
